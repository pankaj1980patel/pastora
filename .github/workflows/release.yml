name: Release

# Builds macOS (universal), Windows and Linux and uploads them to the GitHub release
# for the tag, replacing files with the same name. Push a tag like v0.2.0 (matching the
# version in tauri.conf.json), or run it by hand for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            args: --target universal-apple-darwin --bundles app,dmg
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
          - os: windows-latest
            name: Windows
            args: --bundles msi,nsis
            bundle: src-tauri/target/release/bundle
          - os: ubuntu-22.04
            name: Linux
            args: --bundles deb,appimage
            bundle: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - run: npm ci
      # Update packages are only made here, where the signing key is: building from source needs no key.
      # bash on every OS: PowerShell would strip the quotes from the JSON.
      - run: npm run tauri build -- ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
        shell: bash
        env:
          # Signs the update packages; the app only installs updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Collect files
        shell: bash
        run: |
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          b="${{ matrix.bundle }}"
          mkdir out
          # Copies a file and its update signature (.sig), if the build made one.
          put() { cp $1 "out/$2"; for s in $1.sig; do [ -f "$s" ] && cp "$s" "out/$2.sig"; done; true; }
          case "${{ matrix.name }}" in
            macOS)
              cp "$b"/dmg/*.dmg "out/Pastora_${ver}_macOS_universal.dmg"
              ditto -c -k --keepParent "$b/macos/Pastora.app" "out/Pastora_${ver}_macOS_universal.app.zip"
              put "$b/macos/Pastora.app.tar.gz" "Pastora_${ver}_macOS_universal.app.tar.gz" ;;
            Windows)
              put "$b/msi/*.msi" "Pastora_${ver}_Windows_x64.msi"
              put "$b/nsis/*.exe" "Pastora_${ver}_Windows_x64-setup.exe" ;;
            Linux)
              put "$b/deb/*.deb" "Pastora_${ver}_Linux_amd64.deb"
              put "$b/appimage/*.AppImage" "Pastora_${ver}_Linux_x86_64.AppImage" ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Write latest.json (what installed apps update from)
        run: |
          ver="${TAG#v}"
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          # platform key -> file; the updater tries "<os>-<arch>-<installer>" first, then "<os>-<arch>".
          entries=(
            "darwin-aarch64 Pastora_${ver}_macOS_universal.app.tar.gz"
            "darwin-x86_64 Pastora_${ver}_macOS_universal.app.tar.gz"
            "windows-x86_64 Pastora_${ver}_Windows_x64-setup.exe"
            "windows-x86_64-nsis Pastora_${ver}_Windows_x64-setup.exe"
            "windows-x86_64-msi Pastora_${ver}_Windows_x64.msi"
            "linux-x86_64 Pastora_${ver}_Linux_x86_64.AppImage"
            "linux-x86_64-appimage Pastora_${ver}_Linux_x86_64.AppImage"
            "linux-x86_64-deb Pastora_${ver}_Linux_amd64.deb"
          )
          platforms='{}'
          for e in "${entries[@]}"; do
            read -r key file <<< "$e"
            sig="out/$file.sig"
            if [ -f "$sig" ]; then
              platforms=$(jq --arg k "$key" --arg s "$(cat "$sig")" --arg u "$base/$file" '. + {($k): {signature: $s, url: $u}}' <<< "$platforms")
            fi
          done
          # Without macOS and Windows entries installed apps would never update: fail loudly.
          jq -e 'has("darwin-aarch64") and has("windows-x86_64")' <<< "$platforms" > /dev/null
          jq -n --arg v "$ver" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg n "See $GITHUB_SERVER_URL/$GH_REPO/releases/tag/$TAG" \
            --argjson p "$platforms" '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > out/latest.json
          cat out/latest.json
      - name: Upload to the release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Pastora ${TAG#v}" --notes "Downloads for macOS (universal), Windows and Linux are below."
          fi
          gh release upload "$TAG" out/* --clobber
      - name: Update SHA256SUMS.txt
        run: |
          mkdir all
          gh release download "$TAG" --dir all --pattern 'Pastora_*'
          (cd all && sha256sum $(ls Pastora_* | grep -v '\.sig$') > SHA256SUMS.txt)
          gh release upload "$TAG" all/SHA256SUMS.txt --clobber
