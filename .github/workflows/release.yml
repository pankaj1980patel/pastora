name: Release

# Push a tag like v0.2.0 (matching the version in tauri.conf.json) to build
# a universal macOS DMG and create a draft GitHub release for review.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Pastora __VERSION__
          releaseBody: |
            Download the `.dmg` below (universal: Apple Silicon + Intel, macOS 11+).
            First launch: System Settings → Privacy & Security → **Open Anyway**,
            or run `xattr -dr com.apple.quarantine /Applications/Pastora.app`.
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin
